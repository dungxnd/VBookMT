name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # =========================================================================
  # 0. Preflight - fast gatekeeper verifying tag consistency
  # =========================================================================
  preflight:
    name: Verify Tag & Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check version consistency
        env:
          TAG_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
        run: python scripts/verify_tag.py "$TAG_REF"

  # =========================================================================
  # 1. Build Android APK
  # =========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android Native Libraries
        id: cache-native-libs
        uses: actions/cache@v4
        with:
          path: |
            apps/android/src/main/jniLibs
            apps/android/src/main/cpp/include
          key: android-native-${{ hashFiles('scripts/build_android_native.sh') }}-arm64-v8a

      - name: Build SentencePiece Native Libraries
        if: steps.cache-native-libs.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build_android_native.sh
          ./scripts/build_android_native.sh

      - name: Build Android APK
        run: |
          ./gradlew :apps:android:assembleRelease --stacktrace
          mkdir -p dist
          cp apps/android/build/outputs/apk/release/*.apk dist/VBookMT-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/VBookMT-Android.apk
          if-no-files-found: error

  # =========================================================================
  # 2. Build Windows Application & MSI Installer
  # =========================================================================
  build-windows:
    name: Build Windows App & MSI
    runs-on: windows-latest
    needs: preflight
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Windows native dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            build/native-win/sentencepiece
            build/native-win/build-spm
          key: win-deps-${{ hashFiles('scripts/build_windows_native.ps1') }}

      - name: Build native engine DLLs
        run: |
          $buildArgs = @()
          if ('${{ steps.cache-deps.outputs.cache-hit }}' -eq 'true') {
              $buildArgs += '-SkipDeps'
          }
          ./scripts/build_windows_native.ps1 @buildArgs

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows Compose Desktop Application & MSI
        run: |
          .\gradlew.bat :apps:windows:createDistributable :apps:windows:packageMsi --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Gradle build failed with exit code $LASTEXITCODE" }

          New-Item -ItemType Directory -Force -Path dist
          $appDir = "apps\windows\build\compose\binaries\main\app\VBookMT"
          if (-not (Test-Path $appDir)) {
              throw "Compose distributable directory not found at $appDir!"
          }
          Copy-Item NOTICE.md $appDir\
          Copy-Item README.md $appDir\
          Compress-Archive -Path "$appDir\*" -DestinationPath dist\VBookMT-Windows.zip

          if (Test-Path "apps\windows\build\compose\binaries\main\msi\*.msi") {
              Copy-Item "apps\windows\build\compose\binaries\main\msi\*.msi" "dist\"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            dist/VBookMT-Windows.zip
            dist/*.msi
          if-no-files-found: error

  # =========================================================================
  # 3. Package Extension, Generate Notes & Publish Release
  # =========================================================================
  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Package vBook Extension
        run: |
          mkdir -p release-assets
          python scripts/package_extension.py release-assets/vbookmt-extension.zip
          cp release-assets/vbookmt-extension.zip "release-assets/vbookmt-extension-${{ steps.vars.outputs.tag }}.zip"

      - name: Generate Release Notes
        run: |
          mkdir -p build
          python scripts/generate_release_notes.py "${{ steps.vars.outputs.tag }}" build/release_notes.md
          cat build/release_notes.md

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: release-assets

      - name: Rename Android and Windows Assets with Version Tag
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          [ -f release-assets/VBookMT-Android.apk ] && mv release-assets/VBookMT-Android.apk "release-assets/VBookMT-Android-${TAG}.apk"
          [ -f release-assets/VBookMT-Windows.zip ] && mv release-assets/VBookMT-Windows.zip "release-assets/VBookMT-Windows-${TAG}.zip"
          ls -lh release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "VBookMT Release ${{ steps.vars.outputs.tag }}"
          body_path: build/release_notes.md
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            release-assets/*
