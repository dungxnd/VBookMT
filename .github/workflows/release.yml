name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
# A tag push and a manual dispatch for the same version must never overlap: publishing a release is
# not idempotent, so a running release is never cancelled by a newer one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read  # every job reads; only the publish job is granted write, further down

jobs:
  # =========================================================================
  # 0. Preflight - does the tag match what the code says it is?
  # =========================================================================
  preflight:
    name: Verify tag vs manifest & changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Fails in seconds instead of after a ten-minute native build: a tag that disagrees with
      # versionName publishes an APK claiming a different version, and a tag with no CHANGELOG
      # section publishes empty release notes.
      - name: Check version consistency
        env:
          TAG_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys

          tag = os.environ["TAG_REF"].strip().lstrip("v")
          gradle = pathlib.Path("apps/android/build.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          problems = []
          if not match:
              problems.append("could not read versionName from apps/android/build.gradle.kts")
          elif match.group(1) != tag:
              problems.append(f"versionName is {match.group(1)!r} but the tag is {tag!r}")
          if f"## [v{tag}]" not in changelog:
              problems.append(f"CHANGELOG.md has no '## [v{tag}]' section")

          print("\n".join(problems) if problems else f"tag v{tag} matches versionName and CHANGELOG")
          sys.exit(1 if problems else 0)
          PY
  # =========================================================================
  # 1. Build Android APK
  # =========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Cache Android Native Libraries
        id: cache-native-libs
        uses: actions/cache@v4
        with:
          path: |
            apps/android/src/main/jniLibs
            apps/android/src/main/cpp/include
          # Keyed on the build script's content. It used to hardcode "v4.5.0" while the script builds
          # CTranslate2 4.8.4, so a cache hit restored prebuilt headers from a different dependency
          # set than the sources expect - which broke this very job on a missing absl header.
          # No restore-keys on purpose: a partial restore is the bug, not the mitigation.
          key: android-native-${{ hashFiles('scripts/build_android_native.sh') }}-arm64-v8a

      - name: Build CTranslate2 & SentencePiece Native Libraries
        if: steps.cache-native-libs.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build_android_native.sh
          ./scripts/build_android_native.sh

      - name: Build Android APK
        run: |
          # Build optimized release APK (minified, resource-shrunk, signed with debug keystore)
          gradle :apps:android:assembleRelease --stacktrace
          
          mkdir -p dist
          cp apps/android/build/outputs/apk/release/*.apk dist/VBookMT-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/VBookMT-Android.apk
          if-no-files-found: error

  # =========================================================================
  # 2. Build Windows Native EXE (.zip)
  # =========================================================================
  build-windows:
    name: Build Windows Native App
    runs-on: windows-latest
    needs: preflight
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build Windows Kotlin/Native Binary
        run: |
          gradle :apps:windows:assemble --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Gradle build failed with exit code $LASTEXITCODE" }
          
          New-Item -ItemType Directory -Force -Path dist\VBookMT-Windows
          $exeFound = $false
          if (Test-Path "apps\windows\build\bin\windows\releaseExecutable\*.exe") {
              Copy-Item "apps\windows\build\bin\windows\releaseExecutable\*.exe" "dist\VBookMT-Windows\"
              $exeFound = $true
          } elseif (Test-Path "apps\windows\build\bin\windows\debugExecutable\*.exe") {
              Copy-Item "apps\windows\build\bin\windows\debugExecutable\*.exe" "dist\VBookMT-Windows\"
              $exeFound = $true
          }
          if (-not $exeFound) {
              throw "No Windows executable found in apps/windows/build/bin/windows!"
          }
          Copy-Item NOTICE.md dist\VBookMT-Windows\
          Copy-Item README.md dist\VBookMT-Windows\
          
          Compress-Archive -Path dist\VBookMT-Windows\* -DestinationPath dist\VBookMT-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/VBookMT-Windows.zip
          if-no-files-found: error

  # =========================================================================
  # 3. Package vBook Extension
  # =========================================================================
  package-extension:
    name: Package vBook Extension
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Extension Package (.zip)
        run: |
          mkdir -p dist
          python scripts/package_extension.py dist/vbookmt-extension.zip

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vbook-extension-zip
          path: dist/vbookmt-extension.zip
          if-no-files-found: error

  # =========================================================================
  # 4. Generate Release Notes & Publish to GitHub Releases
  # =========================================================================
  release:
    name: Publish GitHub Release
    needs: [preflight, build-android, build-windows, package-extension]
    permissions:
      contents: write  # the only job that publishes anything
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for git log extraction

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        run: |
          mkdir -p build
          python scripts/generate_release_notes.py "${{ steps.vars.outputs.tag }}" build/release_notes.md
          cat build/release_notes.md

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release-assets

      - name: Download Extension Artifact
        uses: actions/download-artifact@v4
        with:
          name: vbook-extension-zip
          path: release-assets

      - name: Rename Release Files with Version Tag
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mv release-assets/VBookMT-Android.apk "release-assets/VBookMT-Android-${TAG}.apk"
          mv release-assets/VBookMT-Windows.zip "release-assets/VBookMT-Windows-${TAG}.zip"
          mv release-assets/vbookmt-extension.zip "release-assets/vbookmt-extension-${TAG}.zip"
          ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "VBookMT Release ${{ steps.vars.outputs.tag }}"
          body_path: build/release_notes.md
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            release-assets/VBookMT-Android-${{ steps.vars.outputs.tag }}.apk
            release-assets/VBookMT-Windows-${{ steps.vars.outputs.tag }}.zip
            release-assets/vbookmt-extension-${{ steps.vars.outputs.tag }}.zip
