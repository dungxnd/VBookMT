name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# One run per ref: a force-push or a burst of pushes should not queue behind stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts & extension artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # plugin.zip is committed because it is what users install, but it is generated. Nothing used
      # to rebuild or verify it, so a source change could ship the previous defaults inside the zip
      # (v1.0.0 shipped a stale 15 s timeout that way). This also checks that plugin.json and
      # src/config.js agree about every setting default.
      - name: Verify committed extension artifact
        run: python scripts/verify_extension.py

      - name: Test Extension Packaging
        run: |
          python scripts/package_extension.py build/test-extension.zip
          test -f build/test-extension.zip

      - name: Test Release Notes Generation
        run: |
          python scripts/generate_release_notes.py v1.0.0 build/test-notes.md
          test -f build/test-notes.md

  build-core:
    name: Build Core & KMP Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build Core & Run JVM Tests
        run: gradle :core:assemble :core:jvmTest

  compile-android:
    name: Compile Android (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      # Kotlin only, on purpose: no NDK, no prebuilt CTranslate2, no ten-minute native build. This is
      # the check that catches the class of failure which used to surface only when a release tag was
      # pushed - a stale API reference in the app module, an unresolved import, a broken Compose
      # screen. `:core` compiles fine in that situation, which is why the core job alone missed it.
      - name: Compile debug sources
        run: gradle :apps:android:compileDebugKotlin
