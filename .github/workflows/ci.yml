name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# One run per ref: a force-push or a burst of pushes should not queue behind stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Test & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Validate extension artifact integrity and release notes generator
      - name: Validate scripts & extension artifact
        run: |
          python scripts/verify_extension.py
          python scripts/package_extension.py build/test-extension.zip
          test -f build/test-extension.zip
          python scripts/generate_release_notes.py v1.0.0 build/test-notes.md
          test -f build/test-notes.md

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Single Gradle daemon compiles core, tests, Android debug, and Windows Compose desktop
      - name: Build Core, Tests & Multiplatform Hosts
        run: ./gradlew :core:assemble :core:jvmTest :apps:android:compileDebugKotlin :apps:windows:compileKotlinDesktop

  native-windows:
    name: Windows Native & Desktop Tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache native DLL
        id: cache-native-dll
        uses: actions/cache@v4
        with:
          path: apps/windows/resources-packaged/windows/vbookmt_native.dll
          key: win-native-dll-${{ hashFiles('native/**', 'scripts/build_windows_native.ps1') }}

      - name: Cache native dependencies
        if: steps.cache-native-dll.outputs.cache-hit != 'true'
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            build/native-win/sentencepiece
            build/native-win/build-spm
          key: win-deps-${{ hashFiles('scripts/build_windows_native.ps1') }}
          restore-keys: |
            win-deps-

      - name: Build vbookmt_native.dll
        if: steps.cache-native-dll.outputs.cache-hit != 'true'
        run: |
          if ((Test-Path "build/native-win/build-spm") -or ('${{ steps.cache-deps.outputs.cache-hit }}' -eq 'true')) {
              ./scripts/build_windows_native.ps1 -SkipDeps
          } else {
              ./scripts/build_windows_native.ps1
          }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Desktop Tests
        run: .\gradlew.bat :apps:windows:desktopTest

      - name: Upload native DLLs
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-dlls
          path: apps/windows/resources-packaged/windows/*.dll
          if-no-files-found: error
